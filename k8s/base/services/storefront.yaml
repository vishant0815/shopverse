# Storefront (Next.js). Server-rendered pages read the products, search and analytics services over
# the internal network. NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is baked in at build time, so CI passes it
# as a build argument; it is not read here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/vishant0815/shopverse-frontend:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PRODUCTS_API_URL
              value: "http://products:8000"
            - name: SEARCH_API_URL
              value: "http://search:8000"
            - name: ANALYTICS_API_URL
              value: "http://analytics:8000"
          readinessProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
