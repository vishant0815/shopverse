# Products service (Django), its Kafka worker and the flash-sale scheduler, which re-announces
# listings when a sale starts or ends. All three use the products image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  labels:
    app: products
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
        - name: products
          image: ghcr.io/vishant0815/shopverse-products:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: PRODUCTS_SECRET_KEY
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,products"
            - name: DB_NAME
              value: "products_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-redis
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: SEED_DEMO_DATA
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: SEED_DEMO_DATA
            - name: ORDERS_SERVICE_URL
              value: "http://orders:8000"
          readinessProbe:
            httpGet:
              path: "/health/"
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: products
  labels:
    app: products
spec:
  selector:
    app: products
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-scheduler
  labels:
    app: products-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-scheduler
  template:
    metadata:
      labels:
        app: products-scheduler
    spec:
      containers:
        - name: products-scheduler
          image: ghcr.io/vishant0815/shopverse-products:latest
          command: ["python", "manage.py", "refresh_flash_sale_listings", "--loop"]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: PRODUCTS_SECRET_KEY
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,products"
            - name: DB_NAME
              value: "products_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-redis
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-worker
  labels:
    app: products-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-worker
  template:
    metadata:
      labels:
        app: products-worker
    spec:
      containers:
        - name: products-worker
          image: ghcr.io/vishant0815/shopverse-products:latest
          command: ["python", "manage.py", "run_worker"]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: PRODUCTS_SECRET_KEY
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,products"
            - name: DB_NAME
              value: "products_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-redis
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: SEED_DEMO_DATA
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: SEED_DEMO_DATA
