# Gateway (FastAPI): the only way into the app from outside the cluster. It routes API calls to the
# services and proxies the storefront. Rate limits come from shopverse-config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/vishant0815/shopverse-gateway:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-redis
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
            - name: USERS_SERVICE_URL
              value: "http://users:8000"
            - name: PRODUCTS_SERVICE_URL
              value: "http://products:8000"
            - name: ORDERS_SERVICE_URL
              value: "http://orders:8000"
            - name: PAYMENTS_SERVICE_URL
              value: "http://payments:8000"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8000"
            - name: SEARCH_SERVICE_URL
              value: "http://search:8000"
            - name: CLICKSTREAM_SERVICE_URL
              value: "http://clickstream:8000"
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics:8000"
            - name: STOREFRONT_URL
              value: "http://frontend:3000"
            - name: TRUSTED_PROXY_HOPS
              value: "0"
            - name: RATE_LIMIT_DEFAULT
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: RATE_LIMIT_DEFAULT
            - name: RATE_LIMIT_LOGIN
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: RATE_LIMIT_LOGIN
            - name: RATE_LIMIT_REFRESH
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: RATE_LIMIT_REFRESH
            - name: RATE_LIMIT_CHECKOUT
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: RATE_LIMIT_CHECKOUT
          readinessProbe:
            httpGet:
              path: "/health"
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
