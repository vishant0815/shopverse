# Users service (Django) and its Kafka worker. Secrets come from shopverse-app and shopverse-postgres;
# the non-secret settings from shopverse-config. Both are created by scripts/k8s-config.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: ghcr.io/vishant0815/shopverse-users:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: USERS_SECRET_KEY
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,users"
            - name: DB_NAME
              value: "users_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REFRESH_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: REFRESH_COOKIE_SECURE
            - name: NUM_PROXIES
              value: "1"
            - name: SEED_DEMO_DATA
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: SEED_DEMO_DATA
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: DEMO_USER_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-redis
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
          readinessProbe:
            httpGet:
              path: "/health/"
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: users
  labels:
    app: users
spec:
  selector:
    app: users
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-worker
  labels:
    app: users-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-worker
  template:
    metadata:
      labels:
        app: users-worker
    spec:
      containers:
        - name: users-worker
          image: ghcr.io/vishant0815/shopverse-users:latest
          command: ["python", "manage.py", "run_worker"]
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: USERS_SECRET_KEY
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: DJANGO_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DJANGO_DEBUG
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,users"
            - name: DB_NAME
              value: "users_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-redis
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
