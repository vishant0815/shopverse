# Payments service (FastAPI) and its worker. The provider is Stripe in test mode or the fake provider,
# chosen by PAYMENT_PROVIDER in shopverse-config. Stripe keys come from shopverse-app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: ghcr.io/vishant0815/shopverse-payments:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DJANGO_DEBUG
            - name: DB_NAME
              value: "payments_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: ORDERS_SERVICE_URL
              value: "http://orders:8000"
            - name: PAYMENT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: PAYMENT_PROVIDER
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: STRIPE_WEBHOOK_SECRET
          readinessProbe:
            httpGet:
              path: "/health"
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: payments
  labels:
    app: payments
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  labels:
    app: payments-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      containers:
        - name: payments-worker
          image: ghcr.io/vishant0815/shopverse-payments:latest
          command: ["python", "-m", "app.worker"]
          env:
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DJANGO_DEBUG
            - name: DB_NAME
              value: "payments_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-postgres
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: ORDERS_SERVICE_URL
              value: "http://orders:8000"
            - name: PAYMENT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: PAYMENT_PROVIDER
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: STRIPE_WEBHOOK_SECRET
