# Clickstream service (FastAPI). It accepts storefront events and queues them on Kafka for the Spark job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickstream
  labels:
    app: clickstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickstream
  template:
    metadata:
      labels:
        app: clickstream
    spec:
      containers:
        - name: clickstream
          image: ghcr.io/vishant0815/shopverse-clickstream:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: shopverse-app
                  key: JWT_SIGNING_KEY
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          readinessProbe:
            httpGet:
              path: "/health"
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: clickstream
  labels:
    app: clickstream
spec:
  selector:
    app: clickstream
  ports:
    - name: http
      port: 8000
      targetPort: 8000
