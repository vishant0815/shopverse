# Runs every test suite on each pull request and each push to main, then builds every image.
# Pushes to main also publish the images to GitHub Container Registry as
# ghcr.io/<owner>/shopverse-<name>, tagged with the commit SHA and latest.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Django and FastAPI services, with the same command the README gives, against the compose stack.
  python-services:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, users, products, orders, payments, inventory, search, clickstream, analytics, notifications-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with random secrets
        run: python3 scripts/create_env.py

      # -T: no terminal in CI.
      - name: Run the tests
        run: docker compose run --rm -T ${{ matrix.service }} pytest

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # The Spark job runs natively: PySpark needs Java, and the Postgres tests need a database.
  analytics-job:
    name: analytics job tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: analytics/requirements-dev.txt

      - name: Install dependencies
        working-directory: analytics
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        working-directory: analytics
        env:
          ANALYTICS_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/analytics_test
        run: pytest

  frontend:
    name: storefront tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

  # Builds every image on each run. Only pushes from main reach the registry.
  images:
    name: build ${{ matrix.name }}
    needs: [python-services, analytics-job, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: users, context: services/users }
          - { name: products, context: services/products }
          - { name: orders, context: services/orders }
          - { name: payments, context: services/payments }
          - { name: inventory, context: services/inventory }
          - { name: search, context: services/search }
          - { name: clickstream, context: services/clickstream }
          - { name: analytics, context: services/analytics-api }
          - { name: notifications, context: services/notifications }
          - { name: gateway, context: gateway }
          - { name: frontend, context: frontend }
          - { name: analytics-job, context: analytics }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shopverse-${{ matrix.name }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          # A publishable key is not a secret. It is baked into the storefront at build time.
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        run: |
          args=()
          if [ "${{ matrix.name }}" = "frontend" ]; then
            args+=(--build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY")
          fi
          docker build "${args[@]}" --tag "$IMAGE:${{ github.sha }}" "${{ matrix.context }}"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
