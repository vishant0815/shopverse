name: shopverse

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopverse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SERVICE_DATABASES: ${SERVICE_DATABASES}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: shopverse-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - backend

  users:
    build:
      context: ./services/users
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-users
    environment:
      DJANGO_SECRET_KEY: ${USERS_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,users
      DB_NAME: users_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      # Requests arrive through the gateway, which puts the caller's address in X-Forwarded-For.
      NUM_PROXIES: 1
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    ports:
      - "${USERS_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  products:
    build:
      context: ./services/products
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-products
    environment:
      DJANGO_SECRET_KEY: ${PRODUCTS_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,products
      DB_NAME: products_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${PRODUCTS_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  orders:
    build:
      context: ./services/orders
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-orders
    environment:
      DJANGO_SECRET_KEY: ${ORDERS_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,orders
      DB_NAME: orders_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      PRODUCTS_SERVICE_URL: http://products:8000
    ports:
      - "${ORDERS_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      products:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  payments:
    build:
      context: ./services/payments
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-payments
    environment:
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DEBUG: ${DJANGO_DEBUG:-false}
      DB_NAME: payments_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      ORDERS_SERVICE_URL: http://orders:8000
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${PAYMENTS_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  gateway:
    build:
      context: ./gateway
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-gateway
    environment:
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      USERS_SERVICE_URL: http://users:8000
      PRODUCTS_SERVICE_URL: http://products:8000
      ORDERS_SERVICE_URL: http://orders:8000
      PAYMENTS_SERVICE_URL: http://payments:8000
      STOREFRONT_URL: http://frontend:3000
      # Browsers connect straight to the gateway. Behind a cloud load balancer, set 1.
      TRUSTED_PROXY_HOPS: 0
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-300/minute}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10/minute}
      RATE_LIMIT_REFRESH: ${RATE_LIMIT_REFRESH:-60/minute}
      RATE_LIMIT_CHECKOUT: ${RATE_LIMIT_CHECKOUT:-10/minute}
    # The only published port for the app: the whole site, pages and API, comes through here.
    ports:
      - "${SITE_PORT:-3000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      frontend:
        condition: service_healthy
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    container_name: shopverse-frontend
    environment:
      # Server-rendered catalogue pages read the products service directly over the
      # internal network (cached, read-only). Browsers reach this only through the gateway.
      PRODUCTS_API_URL: http://products:8000
    # No published port: visitors come in through the gateway, which is what lets it
    # see their real address for rate limiting.
    expose:
      - "3000"
    depends_on:
      products:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
