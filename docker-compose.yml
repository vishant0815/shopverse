name: shopverse

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopverse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SERVICE_DATABASES: ${SERVICE_DATABASES}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: shopverse-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - backend

  users:
    build:
      context: ./services/users
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-users
    environment:
      DJANGO_SECRET_KEY: ${USERS_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,users
      DB_NAME: users_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    ports:
      - "${USERS_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  products:
    build:
      context: ./services/products
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-products
    environment:
      DJANGO_SECRET_KEY: ${PRODUCTS_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,products
      DB_NAME: products_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${PRODUCTS_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  orders:
    build:
      context: ./services/orders
      args:
        INSTALL_DEV: "true"
    container_name: shopverse-orders
    environment:
      DJANGO_SECRET_KEY: ${ORDERS_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,orders
      DB_NAME: orders_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      PRODUCTS_SERVICE_URL: http://products:8000
    ports:
      - "${ORDERS_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      products:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
